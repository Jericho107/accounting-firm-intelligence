name: bootstrap-portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize repository
        env:
          PAYLOAD: 
        run: |
          python - <<'PY'
          import os, base64, gzip, io, tarfile
          data = base64.b64decode(os.environ["PAYLOAD"])
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tf:
              root = os.path.realpath(".")
              for member in tf.getmembers():
                  target = os.path.realpath(os.path.join(root, member.name))
                  if not target.startswith(root + os.sep):
                      raise SystemExit(f"unsafe archive member: {member.name}")
              tf.extractall(".")
          PY
          rm -f .github/workflows/bootstrap-portfolio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize Pretoria BI hardened portfolio repository"
          git push
